<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="About | A Seoul Temple Life, a site for my photos and illustrations of the Seoul Korea Temple of the Church of Jesus Christ of Latter-day Saints">
    <meta name="author" content="Sunyoung Irene Yoon">
    <title>Home | A Seoul Temple Life</title>
    <link rel="stylesheet" href="styles/life-base.css">
    <link rel="stylesheet" href="styles/life-large.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Noto+Serif+KR:wght@200..900&display=swap"
        rel="stylesheet">


    <script src="scripts/life.js" defer></script>

</head>

<body>
    <header>
        <p>A Seoul Temple Life</p>
        <button aria-label="menu button" id="hamburger"></button>
        <nav>
            <ul>
                <li><a href="siteplan.html">Home</a></li>
                <li><a href="photos.html">Photos</a></li>
                <li><a href="illustrations.html">Illustrations</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>

    </header>
    <main>
        <h1>About</h1>
        <div class="contact">
            <h2>Location</h2>
            <section class="map">
                <div>
                    <p>Address:</p>
                    <p>Phone:</p>
                    <p>Available Services:</p>

                </div>
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2494.8655244248885!2d-116.96450642468375!3d51.29519872618482!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5379bf90bf93b443%3A0x7ba554c9c8f391d0!2s1020%2010th%20St%20S%2C%20Golden%2C%20BC%20V0A%201H0%2C%20Canada!5e0!3m2!1sen!2sph!4v1785150519040!5m2!1sen!2sph"
                    width="600" height="450" allowfullscreen="" loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin"></iframe>

            </section>

            <section>
                <h2>History</h2>
                <div>
                    <p>Dedication date</p>
                    <p>Dedicatory prayer</p>
                    <p>History Blurb</p>
                </div>
            </section>
            <form id="contact-form">
                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="placeholder">
                </div>

                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="placeholder">
                </div>
                <div class="radio">
                    <p>Message Purpose</p>
                    <div class="message">
                        <input type="radio" id="general-inquiry" name=message-purpose>
                        <label for="general-inquiry">General Inquiry</label>

                        <input type="radio" id="website-suggestion" name=message-purpose>
                        <label for="website-suggestion">Website Suggestion</label>
                    </div>
                </div>
                <div class="write">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" placeholder="Type here"></textarea>
                </div>

                <div>
                    <label><input type="checkbox" id="newsletter" name="newsletter">Please subscribe me to the monthly
                        newsletter</label>
                </div>

                <div>
                    <button type="submit">Get in touch!</button>
                </div>

            </form>
        </div>


    </main>
    <footer>
        <p id="currentYear"></p>
        <p id="lastModified">Last modified:</p>

    </footer>

</body>

</html>
