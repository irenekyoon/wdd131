<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD131 | Product Review Form</title>
    <meta name="description" content="WDD131 | Week 05: An example of a product review form for different widgets.">
    <meta name="author" content="Sunyoung Irene Yoon">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-lrg.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html" id="pForm">
            <label>Product Name
                <select class="required" name="productName" id="productName" required>
                    <option value="" selected disabled>Select a Product...</option>
                </select>
            </label>

            <div class="description">Overall Rating</div>
            <div id="flexStars">
                <label>⭐⭐⭐⭐⭐<input type="radio" id="fiveStar" name="stars" value="5" required></label>
                <label>⭐⭐⭐⭐<input type="radio" id="fourStar" name="stars" value="4" required></label>
                <label>⭐⭐⭐<input type="radio" id="threeStar" name="stars" value="3" required></label>
                <label>⭐⭐<input type="radio" id="twoStar" name="stars" value="2" required></label>
                <label>⭐<input type="radio" id="oneStar" name="stars" value="1" required></label>
            </div>

            <label>Date<input type="date" id="date" name="date" required>
            </label>

            <div class="description">Useful Features</div>
            <div id="features">
                <label>Design<input type="checkbox" id="design" name="design" value="yes"></label>
                <label>Durability<input type="checkbox" id="durability" name="durability" value="yes"></label>
                <label>Ease of Use<input type="checkbox" id="easeOfUse" name="easeOfUse" value="yes"></label>
                <label>Performance<input type="checkbox" id="performance" name="performance" value="yes"></label>
            </div>

            <label>Written Review <span class="optional">(Optional)</span></label>
            <textarea name="message" id="message"></textarea>
            <label>Your Name <span class="optional">(Optional)</span>
                <input type="text" name="name"></label>


            <input type="submit" value="Post Review" class="submit">
        </form>
    </main>
    <footer>
        <p id="contentYear"></p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
