<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD131 | Product Review Form</title>
    <meta name="description" content="WDD131 | Week 05: An example of a product review form for different widgets.">
    <meta name="author" content="Sunyoung Irene Yoon">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-lrg.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html" id="pForm">
            <label for="productName">Product Name
                <select class="required" name="productName" id="productName" required>
                    <option value="" selected disabled>Select a Product...</option>
                </select>
            </label>

            <div class="description">Overall Rating</div>
            <div id="flexStars">
                <input type="radio" id="oneStar" name="stars" value="1" required><label for="oneStar">✩</label>
                <input type="radio" id="twoStar" name="stars" value="2" required><label for="twoStar">✩✩</label>
                <input type="radio" id="threeStar" name="stars" value="3" required><label for="threeStar">✩✩✩</label>
                <input type="radio" id="fourStar" name="stars" value="4" required><label for="fourStar">✩✩✩✩</label>
                <input type="radio" id="fiveStar" name="stars" value="5" required><label for="fiveStar">✩✩✩✩✩</label>

            </div>

            <label for="date">Date<input type="date" id="date" name="date" required>
            </label>

            <div class="description">Useful Features</div>
            <div id="features">
                <input type="checkbox" id="design" name="design" value="yes"><label for="design">Design</label>
                <input type="checkbox" id="durability" name="durability" value="yes"><label
                    for="durability">Durability</label>
                <input type="checkbox" id="easeOfUse" name="easeOfUse" value="yes"><label for="easeOfUse">Ease of
                    Use</label>
                <input type="checkbox" id="performance" name="performance" value="yes"><label
                    for="performance">Performance</label>
            </div>

            <div class="writtenName">
                <label for="message">Written Review <span class="optional">(Optional)</span></label>
                <textarea name="message" id="message" rows="4"></textarea>
            </div>
            <div class="writtenName">
                <label for="name">Your Name <span class="optional">(Optional)</span>
                    <input type="text" id="name" name="name"></label>
            </div>

            <input type="submit" value="Post Review" class="submit">
        </form>
    </main>
    <footer>
        <p id="contentYear"></p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
