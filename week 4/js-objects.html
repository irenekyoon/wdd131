<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Objects</title>
    <meta name="description" content="Example of JavaScript Objects using a college course schedule.">
    <link rel="stylesheet" href="styles/js-objects.css">
    <script src="scripts/js-objects.js" defer></script>
</head>

<body>
    <header>
        <h1>JavaScript Objects</h1>
    </header>
    <main>
        <h2>College Course Schedule</h2>

        <table id="sections">
            <caption id="courseName"></caption>

            <thead>
                <tr>
                    <th>Section</th>
                    <th>Enrollment</th>
                    <th>Instructor</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </main>
    <footer>
        <p id="currentYear"></p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
