<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD131 Lazy Loading</title>
    <meta name="description" content="An Example of Lazy Loading">
    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>
</head>

<body>
    <header>
        <h1>Lazy Loading Example</h1>
    </header>
    <main>

        <h2>Jesus Christ</h2>
        <picture>
            <img src="images/1.jpg" alt="Jesus Christ in Garden of Gethsemane" loading="lazy" width="300" height="500">
        </picture>
        <picture>
            <img src="images/2.jpg" alt="Jesus Christ at the Second Coming" loading="lazy" width="300" height="500">
        </picture>
        <picture>
            <img src="images/3.jpg" alt="Jesus Christ says He's the fulfillment of prophecy" loading="lazy" width="300"
                height="500">
        </picture>
        <picture>
            <img src="images/4.jpg" alt="Jesus Christ and glowing yellow background" loading="lazy" width="300"
                height="500">
        </picture>
        <picture>
            <img src="images/5.jpg" alt="Jesus Christ Redeemer" loading="lazy" width="300" height="500">
        </picture>
        <picture>
            <img src="images/6.jpg" alt="Jesus Christ's Triumphal Entry into Jerusalem" loading="lazy" width="300"
                height="500">
        </picture>
    </main>
</body>
<footer>
    <p class="currentYear"></p>
    <p id="lastModified"></p>

</footer>

</html>
